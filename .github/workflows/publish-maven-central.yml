name: Publish to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release version, without a leading v
        required: true
        type: string
      automatic:
        description: Publish automatically after Central validation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MAVEN_CENTRAL_NAMESPACE: ${{ vars.MAVEN_CENTRAL_NAMESPACE }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      REQUESTED_VERSION: ${{ inputs.version }}
      REQUESTED_AUTOMATIC: ${{ inputs.automatic }}

    steps:
      - name: Check out release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Resolve and validate release version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            release_version="${GITHUB_REF_NAME#v}"
          else
            release_version="$REQUESTED_VERSION"
          fi
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || [[ "$release_version" == *-SNAPSHOT ]]; then
            echo "Invalid Maven release version: $release_version" >&2
            exit 1
          fi
          echo "MAVEN_RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Build Central Portal bundle
        run: ./gradlew --no-daemon clean build centralBundle

      - name: Preserve bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maven-central-bundle
          path: build/central-bundle/*.zip
          if-no-files-found: error

      - name: Upload to Central Portal
        shell: bash
        run: |
          publishing_type="USER_MANAGED"
          if [[ "$REQUESTED_AUTOMATIC" == "true" ]]; then
            publishing_type="AUTOMATIC"
          fi
          authorization="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 | tr -d '\n')"
          bundle="build/central-bundle/central-bundle-${MAVEN_RELEASE_VERSION}.zip"
          deployment_id="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${authorization}" \
            --form "bundle=@${bundle}" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=besu-native-${MAVEN_RELEASE_VERSION}&publishingType=${publishing_type}")"
          echo "Central deployment: $deployment_id" >> "$GITHUB_STEP_SUMMARY"
